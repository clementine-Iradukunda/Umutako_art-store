# ================================================
#  .github/workflows/deploy.yml
#  CI/CD Pipeline — Umutako Art Store
#
#  This runs automatically on every push to main.
#  It: builds → tests → deploys via Docker
# ================================================

name: Build and Deploy Umutako Art Store

on:
  push:
    branches:
      - main          # Triggers on every push to main branch
  pull_request:
    branches:
      - main

jobs:

  # ── Job 1: Build & Test ────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: docker build -t umutako-art-store:latest .

      - name: Verify files inside container
        run: |
          docker run --rm umutako-art-store:latest ls /var/www/html/
          echo "✅  Build successful!"

  # ── Job 2: Code Quality Check ──────────────────
  lint:
    name: Check HTML & PHP files exist
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check required files are present
        run: |
          echo "Checking required project files..."
          test -f index.html         && echo "✅  index.html found"
          test -f css/style.css      && echo "✅  style.css found"
          test -f js/main.js         && echo "✅  main.js found"
          test -f php/db_connect.php && echo "✅  db_connect.php found"
          test -f php/get_products.php && echo "✅  get_products.php found"
          test -f php/place_order.php  && echo "✅  place_order.php found"
          test -f database.sql       && echo "✅  database.sql found"
          test -f Dockerfile         && echo "✅  Dockerfile found"
          test -f docker-compose.yml && echo "✅  docker-compose.yml found"
          echo "🎉  All required files present!"

  # ── Job 3: Deploy (runs only on push to main) ──
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Option A: Deploy to a VPS via SSH
      # Uncomment and configure secrets in GitHub repo settings
      #
      # - name: Deploy via SSH
      #   uses: appleboy/ssh-action@v0.1.10
      #   with:
      #     host: ${{ secrets.SERVER_HOST }}
      #     username: ${{ secrets.SERVER_USER }}
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}
      #     script: |
      #       cd /var/www/umutako
      #       git pull origin main
      #       docker-compose up -d --build

      # Option B: Simple confirmation (replace with real deploy step)
      - name: Deployment step
        run: |
          echo "🚀  Deploying Umutako Art Store to production server..."
          echo "✅  Deployment complete at $(date)"
          echo "🌐  Live at: https://your-domain.com"
