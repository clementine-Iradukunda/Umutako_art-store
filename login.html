<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — Umutako Art Store</title>
    <link rel="stylesheet" href="css/style.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
    <style>
        body { background: var(--choc-900); display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
        .auth-box { background:var(--white); border-radius:var(--radius-lg); width:100%; max-width:440px; overflow:hidden; box-shadow:var(--shadow-lg); }
        .auth-logo { background:var(--choc-900); text-align:center; padding:28px 20px 20px; }
        .auth-logo h2 { font-family:'Playfair Display',serif; color:var(--gold-500); font-size:1.5rem; }
        .auth-logo p  { color:var(--cream-d); font-size:.82rem; opacity:.7; margin-top:4px; }
        .auth-tabs { display:flex; border-bottom:2px solid var(--cream-d); }
        .auth-tab  { flex:1; padding:14px; text-align:center; font-weight:700; font-size:.92rem; cursor:pointer; color:var(--text-400); border:none; background:none; transition:.2s; }
        .auth-tab.active { color:var(--gold-500); border-bottom:2px solid var(--gold-500); margin-bottom:-2px; }
        .auth-panel { display:none; padding:28px; }
        .auth-panel.active { display:block; }
        .auth-error { background:#fdecea; border:1px solid #f5c6cb; color:#C0392B; padding:10px 14px; border-radius:var(--radius-sm); font-size:.86rem; margin-bottom:16px; display:none; }
        .auth-footer { text-align:center; padding:0 28px 22px; font-size:.83rem; color:var(--text-400); }
        .auth-footer a { color:var(--gold-500); font-weight:700; cursor:pointer; }
    </style>
</head>
<body>

<div class="auth-box">
    <div class="auth-logo">
        <h2>🎨 Umutako Art Store</h2>
        <p>Handcrafted in Rwanda</p>
    </div>

    <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('login')">Login</button>
        <button class="auth-tab"        onclick="switchTab('register')">Register</button>
    </div>

    <!-- LOGIN -->
    <div class="auth-panel active" id="panel-login">
        <div class="auth-error" id="login-error"></div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="login-email" placeholder="admin@umutako.rw"/>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-pass" placeholder="••••••••"/>
        </div>
        <button class="place-order-btn" onclick="doLogin()">🔐 Login</button>
    </div>

    <!-- REGISTER -->
    <div class="auth-panel" id="panel-register">
        <div class="auth-error" id="reg-error"></div>
        <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="reg-name" placeholder="e.g. Uwase Clémentine"/>
        </div>
        <div class="form-group">
            <label>Email Address *</label>
            <input type="email" id="reg-email" placeholder="e.g. uwase@email.com"/>
        </div>
        <div class="form-group">
            <label>Password * <small style="font-weight:400;color:var(--text-400)">(min 6 chars)</small></label>
            <input type="password" id="reg-pass" placeholder="••••••••"/>
        </div>
        <div class="form-group">
            <label>Phone <small style="font-weight:400;color:var(--text-400)">(optional)</small></label>
            <input type="tel" id="reg-phone" placeholder="+250 788 000 000"/>
        </div>
        <button class="place-order-btn" onclick="doRegister()">✅ Create Account</button>
    </div>

    <div class="auth-footer">
        <a href="index.html">← Back to Shop</a>
    </div>
</div>

<script>
function switchTab(tab) {
    document.querySelectorAll('.auth-tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='register')));
    document.getElementById('panel-login').classList.toggle('active', tab==='login');
    document.getElementById('panel-register').classList.toggle('active', tab==='register');
}

function showError(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.style.display = 'block';
}
function hideError(id) { document.getElementById(id).style.display = 'none'; }

function doLogin() {
    hideError('login-error');
    const email = document.getElementById('login-email').value.trim();
    const pass  = document.getElementById('login-pass').value.trim();
    if (!email || !pass) { showError('login-error','Please enter email and password.'); return; }

    fetch('php/login.php', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email, password: pass })
    })
    .then(r=>r.json())
    .then(d => {
        if (d.success) { window.location.href = d.redirect; }
        else showError('login-error', d.message);
    })
    .catch(()=>showError('login-error','Server error. Please try again.'));
}

function doRegister() {
    hideError('reg-error');
    const name  = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const pass  = document.getElementById('reg-pass').value.trim();
    const phone = document.getElementById('reg-phone').value.trim();
    if (!name||!email||!pass) { showError('reg-error','Name, email and password are required.'); return; }

    fetch('php/register.php', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ name, email, password: pass, phone })
    })
    .then(r=>r.json())
    .then(d => {
        if (d.success) { window.location.href = d.redirect; }
        else showError('reg-error', d.message);
    })
    .catch(()=>showError('reg-error','Server error. Please try again.'));
}

// Allow Enter key
document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (document.getElementById('panel-login').classList.contains('active')) doLogin();
    else doRegister();
});
</script>
</body>
</html>
